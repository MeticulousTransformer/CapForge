name: Test and release CapForge

on:
  push:
    branches: [kml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: capforge-release-kml
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  CAPFORGE_RELEASE_TAG: build-${{ github.sha }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare test dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Check all components
        run: python scripts/check_release.py

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build shared payload and standalone EXE
        run: |
          python scripts/package_release.py --source-only
          python scripts/build_windows.py --archive dist/CapForge-0.3.3.zip
          python scripts/package_update.py --archive dist/CapForge-0.3.3.zip --native dist/CapForge-0.3.3-Windows.exe --platform windows --output dist/public/CapForge-0.3.3-Windows.zip
          Copy-Item dist/CapForge-0.3.3-Windows.exe* dist/public/
      - name: Install the exact EXE on a fresh Windows destination
        run: python scripts/check_native_install.py --platform windows --installer dist/public/CapForge-0.3.3-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: capforge-windows
          path: dist/public/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build universal native app and DMG
        run: |
          python scripts/package_release.py --source-only
          python scripts/build_macos.py --archive dist/CapForge-0.3.3.zip
          python scripts/package_update.py --archive dist/CapForge-0.3.3.zip --native dist/CapForge.app --platform macos --output dist/public/CapForge-0.3.3-macOS.zip
          python scripts/package_update.py --archive dist/CapForge-0.3.3.zip --native dist/CapForge.app --platform macos --legacy --output dist/public/CapForge-0.3.3.zip
          cp dist/CapForge-0.3.3-macOS.dmg* dist/public/
      - uses: actions/upload-artifact@v7
        with:
          name: capforge-macos
          path: dist/public/*
          if-no-files-found: error

  verify_macos:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: capforge-macos
          path: dist
      - name: Verify disk image and install its app
        run: |
          cd dist
          shasum -a 256 -c CapForge-0.3.3-macOS.dmg.sha256
          cd ..
          mount="$RUNNER_TEMP/CapForge mounted"
          mkdir -p "$mount"
          hdiutil attach dist/CapForge-0.3.3-macOS.dmg -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/CapForge.app"
          python scripts/check_native_install.py --platform macos --installer "$mount/CapForge.app/Contents/MacOS/CapForge"

  release:
    needs: [windows, verify_macos]
    if: github.ref == 'refs/heads/kml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: capforge-*
          merge-multiple: true
          path: dist
      - name: Publish both native installers together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_commit=$(gh api "repos/$GH_REPO/commits/kml" --jq .sha)
          test "$latest_commit" = "$GITHUB_SHA" || exit 1
          if gh release view "$CAPFORGE_RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Choose your computer

          - **Mac:** download `CapForge-0.3.3-macOS.dmg`, open it, drag CapForge to Applications, and open CapForge. [Mac guide](https://github.com/MeticulousTransformer/Georgian-Kartuli-After-Effects-Transcribtion-Tool/blob/kml/docs/INSTALL_MAC.md).
          - **Windows:** download and open `CapForge-0.3.3-Windows.exe`. No ZIP extraction. [Windows guide](https://github.com/MeticulousTransformer/Georgian-Kartuli-After-Effects-Transcribtion-Tool/blob/kml/docs/INSTALL_WINDOWS.md).

          Both installers share this exact commit and version. First setup needs internet; Python and audio support are prepared privately. Save your AE project and close AE before installation.

          This preview is not Developer-ID notarized or Windows code-signed. OS trust warnings can appear. Adobe unsigned-extension mode is an explicit preview option. See your OS guide.

          Packaged installation passed on Windows, Apple Silicon and Intel Mac. Real AE compatibility and paid transcription should be checked on your own clips.

          The ZIP assets and their checksums support automatic updates and migration from 0.3.2; new users should choose the DMG or EXE above.
          NOTES
          gh release create "$CAPFORGE_RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "CapForge 0.3.3 · Mac & Windows · ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest

  website:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Publish download website
        id: deployment
        uses: actions/deploy-pages@v4
