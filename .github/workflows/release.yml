name: Test and release CapForge

on:
  push:
    branches: [kml]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older build before it can become the latest release.
concurrency:
  group: capforge-release-kml
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  CAPFORGE_RELEASE_TAG: build-${{ github.sha }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare test dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Check all components
        run: python scripts/check_release.py
      - name: Install from source on a fresh Mac destination
        if: runner.os == 'macOS'
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/Fresh Mac ქართული/CapForge"
          extensions="$RUNNER_TEMP/Fresh Mac ქართული/Extensions"
          ./Install\ macOS.command --headless --target "$runtime" --extension-root "$extensions"
          "$runtime/.venv/bin/python" -m pip check
          "$runtime/.venv/bin/python" -I scripts/check_installed_runtime.py "$runtime"
          test -f "$extensions/com.kartuli.captionforge/CSXS/manifest.xml"
      - name: Install from source on a fresh Windows destination
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'Fresh Windows ქართული\CapForge'
          $extensions = Join-Path $env:RUNNER_TEMP 'Fresh Windows ქართული\Extensions'
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/bootstrap_windows.ps1 -Headless -BootstrapOnly -RuntimeRoot $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Private runtime bootstrap failed.' }
          $python = $output | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $python)) { throw 'Private Python was not prepared.' }
          & $python installer/install.py --headless --target $runtime --extension-root $extensions
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed.' }
          $installedPython = Join-Path $runtime '.venv\Scripts\python.exe'
          & $installedPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependencies are inconsistent.' }
          & $installedPython -I scripts/check_installed_runtime.py $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime or audio support failed.' }
          if (-not (Test-Path (Join-Path $extensions 'com.kartuli.captionforge\CSXS\manifest.xml'))) { throw 'CEP panel is missing.' }

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the ZIP with the native Windows launcher
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: capforge-release
          path: |
            dist/CapForge-*.zip
            dist/CapForge-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  verify_download:
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: capforge-release
          path: dist
      - name: Validate the Windows-built download on Mac
        shell: bash
        run: |
          python -m pip install -r backend/requirements-lock.txt
          python scripts/check_release.py --archive dist/CapForge-*.zip --require-windows-launcher
          archives=(dist/CapForge-*.zip)
          extracted="$RUNNER_TEMP/Downloaded CapForge ქართული"
          /usr/bin/ditto -x -k "${archives[0]}" "$extracted"
          package="$extracted/$(basename "${archives[0]}" .zip)"
          runtime="$RUNNER_TEMP/Fresh Download ქართული/CapForge"
          extensions="$RUNNER_TEMP/Fresh Download ქართული/Extensions"
          "$package/Install macOS.command" --headless --target "$runtime" --extension-root "$extensions"
          "$runtime/.venv/bin/python" -m pip check
          "$runtime/.venv/bin/python" -I scripts/check_installed_runtime.py "$runtime"
          test -f "$runtime/release.json"
          test -f "$extensions/com.kartuli.captionforge/CSXS/manifest.xml"

  release:
    needs: verify_download
    if: github.ref == 'refs/heads/kml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: capforge-release
          path: dist
      - name: Publish this tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          latest_commit=$(gh api "repos/$GH_REPO/commits/kml" --jq .sha)
          if [ "$latest_commit" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on kml; this build will not become a release.'
            exit 0
          fi
          if gh release view "$CAPFORGE_RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This commit already has a release.'
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download and extract the CapForge ZIP, then open CapForge Setup.exe on Windows or Install macOS.command on Mac. First setup needs internet and prepares Python, transcription packages, and audio support automatically.

          Automated checks passed on Windows and Intel Mac, followed by installation of this exact ZIP on Apple Silicon Mac. This unsigned preview still needs real After Effects playback checks for the AE versions you use.
          NOTES
          gh release create "$CAPFORGE_RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --target "$GITHUB_SHA" --title "CapForge build ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
